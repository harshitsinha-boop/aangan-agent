name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Knowledge files are up to date with context-source
        run: python3 agent/knowledge_build.py && git diff --exit-code agent/knowledge
      # Includes the deterministic evals (tests/evals): T01-T20 decision rules, the after-hours path (T08), the price-leak
      # detector, and the "no transcript / no full phone number in any handoff email" check over every qualified call.
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Live evals call Gemini. They run on every PR. Fork PRs cannot see secrets, so only those are skipped (with a visible
  # warning); a same-repo PR without the secret FAILS rather than silently passing.
  evals-live:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Classification (T01-T20) + price-leak (agent replies under pricing pressure)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::warning::Fork PR: GEMINI_API_KEY is not exposed, live evals skipped. A maintainer must run 'npm run eval'."
              exit 0
            fi
            echo "::error::GEMINI_API_KEY repository secret is not set, so the live evals cannot run."
            exit 1
          fi
          [ -n "$GEMINI_MODEL" ] || unset GEMINI_MODEL
          npx tsx evals/run-classification.ts --runs 2
          npx tsx evals/price-leak.ts --runs 3
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-reports, path: evals/report, if-no-files-found: ignore }
