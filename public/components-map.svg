<rect x="181" y="118" width="188" height="84" rx="9" fill="#c9cffa" stroke="#5a63c8" stroke-width="1.6"/>
<text x="275" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Calls the studio</text>
<text x="275" y="162" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">day or night, in English,</text>
<text x="275" y="180" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">Hindi or Marathi</text>
<rect x="395" y="236" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="489" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Answers instantly</text>
<text x="489" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">says it is Aangan's AI</text>
<text x="489" y="298" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">assistant; call is recorded</text>
<rect x="609" y="236" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="703" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Prompt + studio rules</text>
<text x="703" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">services, 5-point rubric,</text>
<text x="703" y="298" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">never speaks a price</text>
<rect x="609" y="352" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="703" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Studio data (Supabase)</text>
<text x="703" y="396" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">slots, designers, config:</text>
<text x="703" y="414" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">hours, min weeks, budget</text>
<rect x="823" y="352" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="917" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Live tools (mid-call)</text>
<text x="917" y="396" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">look up caller, offer slots,</text>
<text x="917" y="414" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">book (atomic), escalate</text>
<rect x="823" y="454" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="917" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">After the call</text>
<text x="917" y="498" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">webhook: transcript, cost,</text>
<text x="917" y="516" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">after-hours, SLA cron (1 min)</text>
<rect x="1037" y="570" width="188" height="84" rx="9" fill="#c9e8c2" stroke="#3f8f33" stroke-width="1.6"/>
<text x="1131" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Agent brain (in Vaani)</text>
<text x="1131" y="614" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">decides what to say and</text>
<text x="1131" y="632" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">which tool to call</text>
<rect x="1037" y="672" width="188" height="84" rx="9" fill="#c9e8c2" stroke="#3f8f33" stroke-width="1.6"/>
<text x="1131" y="698" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Post-call AI (Gemini)</text>
<text x="1131" y="716" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">reads transcript for facts;</text>
<text x="1131" y="734" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">rules decide the outcome</text>
<rect x="1251" y="236" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="1345" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Fallback alert call</text>
<text x="1345" y="280" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">to Nikhil if an escalation</text>
<text x="1345" y="298" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">is not acknowledged in 5 min</text>
<rect x="1251" y="352" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="1345" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Lead + handoff saved</text>
<text x="1345" y="396" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">designer assigned, signed</text>
<text x="1345" y="414" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">single-use action links</text>
<rect x="1251" y="788" width="188" height="84" rx="9" fill="#f7c3cd" stroke="#c2415d" stroke-width="1.6"/>
<text x="1345" y="814" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">Handoff email</text>
<text x="1345" y="832" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">Accept / Reassign; booking</text>
<text x="1345" y="850" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">confirmation; URGENT alert</text>
<rect x="1251" y="896" width="188" height="84" rx="9" fill="#ecc8ea" stroke="#9a3f95" stroke-width="1.6"/>
<text x="1345" y="922" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">HubSpot deal</text>
<text x="1345" y="940" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">contact + summary note;</text>
<text x="1345" y="958" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">stage follows the lead</text>
<rect x="1251" y="1014" width="188" height="84" rx="9" fill="#f9d0ae" stroke="#c0661a" stroke-width="1.6"/>
<text x="1345" y="1040" text-anchor="middle" font-size="13" font-weight="700" fill="#2b211a">One-click accept</text>
<text x="1345" y="1058" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">dashboard: calls, leads,</text>
<text x="1345" y="1076" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">cost vs pipeline</text>
<text x="12.0" y="1148" font-size="11.5" fill="#6b5d50">Privacy: emails carry a summary and a dashboard link only; the transcript never leaves the system and the phone shows as last 4 digits. Action links change only their own record, once, and expire (72 h / 2 h).</text>
<text x="12.0" y="1167" font-size="11.5" fill="#6b5d50">Safety: no price, rate or per-sq-ft figure is ever spoken (verified by CI). Escalations skip qualification; unacknowledged ones trigger an outbound call. Dashed arrows = data / control flow.</text>
</svg>